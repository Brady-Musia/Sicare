  /* voile : assombrit les bords et le bas pour la lisibilité des panneaux */
  .hp::before { content: ""; position: absolute; inset: 0; z-index: -2; pointer-events: none;
    background: linear-gradient(90deg, rgba(232,240,251,.88) 0%, rgba(232,240,251,.6) 28%, rgba(232,240,251,0) 50%),
                linear-gradient(180deg, rgba(232,240,251,.25) 0%, rgba(232,240,251,0) 25%); }

  /* ---- le bouclier, intégré à la scène ---- */
  .hp-objet { position: absolute; left: 50%; bottom: 23%; width: min(34vw, 54vh); aspect-ratio: 1; transform: translateX(-50%); z-index: 1; }
  /* contre-jour : halo cyan derrière le bouclier, dans l'axe du point de fuite */
  .hp-objet::before { content: ""; position: absolute; left: 50%; top: 44%; width: 120%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.75) 0%, rgba(143,227,247,.30) 35%, rgba(143,227,247,0) 65%); z-index: -1; animation: hp-respire 6s ease-in-out infinite; }
  /* ombre de contact sur le podium */
  .hp-objet::after { content: ""; position: absolute; left: 50%; bottom: 3%; width: 58%; height: 9%; transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(ellipse, rgba(25,35,96,.38) 0%, rgba(25,35,96,0) 70%); filter: blur(5px); z-index: -1; }
  .hp-objet model-viewer { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hp-objet model-viewer { background: transparent; --poster-color: transparent; --progress-bar-height: 0;
    filter: drop-shadow(0 0 24px rgba(255,255,255,.55)) drop-shadow(0 20px 26px rgba(25,35,96,.28)); }
  /* brume devant la base : fond l'objet dans la lumière du podium */
  .hp-brume { position: absolute; left: 50%; bottom: 21%; width: min(44vw, 70vh); height: 12%; transform: translateX(-50%); z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at 50% 60%, rgba(255,255,255,.45) 0%, rgba(255,255,255,0) 70%); filter: blur(10px); }
  @keyframes hp-respire { 0%, 100% { opacity: .75; scale: .96; } 50% { opacity: 1; scale: 1.04; } }
  @keyframes hp-flotte { 0%, 100% { translate: 0 0; } 50% { translate: 0 -8px; } }

  /* ---- texte : mêmes styles que le hero de l'accueil (eyebrow, titre sur deux lignes, accroche, bouton, lien) ---- */
  .hp-texte { position: absolute; z-index: 3; left: max(24px, (100% - 1240px) / 2); top: 50%; transform: translateY(-50%); width: min(560px, 38vw); }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #2A9CC0; }
  .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 0 4px rgba(76,191,223,0.18); }
  .hp-texte h1 { margin-top: 20px; font-family: var(--fh); font-weight: 700; font-size: clamp(34px, 3.8vw, 56px); line-height: 1.08; letter-spacing: -0.025em; color: var(--navy); }
  .hp-texte h1 .ligne { display: block; }
  .hp-texte h1 em { font-style: normal; color: #1f8fb8; }
  .hp-accroche { margin-top: 20px; max-width: 30em; font-size: clamp(16px, 1.35vw, 19px); line-height: 1.6; color: #3a4670; }
  .actions { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; margin-top: 30px; }
  /* boutons de l'accueil */
  .sbtn { display: inline-block; padding: 3px; border-radius: 13px; background: rgba(76,191,223,0.28); text-decoration: none; transition: transform .3s ease; }
  .sbtn:hover { transform: translateY(-2px); }
  .sbtn__in { position: relative; display: flex; align-items: center; gap: 12px; height: 46px; padding-right: 18px; border-radius: 10px; overflow: hidden; isolation: isolate; background: linear-gradient(#4CBFDF 50%, #2E9FC4); }
  .sbtn__fill { position: absolute; inset: 0 auto 0 0; width: 0; z-index: -1; border-radius: 10px; background: linear-gradient(#1b2356 50%, var(--navy)); transition: width .45s cubic-bezier(.65,0,.35,1); }
  .sbtn:hover .sbtn__fill { width: 100%; }
  .sbtn__ico { flex: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 10px; background: linear-gradient(#fff, #EEF3FA); box-shadow: 0 2px 8px rgba(7,10,28,0.12); }
  .sbtn__ico img { width: 26px; height: auto; transition: transform .45s cubic-bezier(.65,0,.35,1); }
  .sbtn:hover .sbtn__ico img { transform: rotate(-120deg); }
  .sbtn__txt { font-weight: 700; font-size: 15.5px; color: var(--navy); white-space: nowrap; transition: color .3s ease; }
  .sbtn:hover .sbtn__txt { color: #fff; }
  .lien { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15.5px; text-decoration: none; color: var(--navy); }
  .lien .fl { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid currentColor; transition: transform .3s ease, background .3s ease, color .3s ease; }
  .lien:hover .fl { transform: translateX(4px); background: var(--navy); color: #fff; border-color: var(--navy); }

  /* ordinateur : comme sur l'accueil, texte à gauche et visuel à droite — la scène (podium + bouclier) est décalée vers la droite */
  @media (min-width: 901px) {
    .hp { --dx: 17vw; background: #e3ecf8; }
    .hp-fond { inset: -3% -3% -3% calc(var(--dx) - 3%); -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 22%); mask-image: linear-gradient(90deg, transparent 0, #000 22%); }
    .hp-objet, .hp-brume { left: calc(50% + var(--dx) / 2); }  /* centre du podium décalé */
    .hp-texte { width: min(620px, 44vw); }
    .hp-texte h1 .ligne { white-space: nowrap; }
    .hp-texte h1 { font-size: clamp(30px, 3.3vw, 54px); }
  }
  @media (max-width: 900px) {
    .hp { height: auto; min-height: 0; padding: calc(12svh + 118vw) 20px 44px; background: #e3ecf8; }
    .hp-fond { inset: 0 -20% auto; height: calc(12svh + 150vw); background-position: 50% 62%; background-size: cover; }
    .hp::before { background: linear-gradient(180deg, rgba(232,240,251,0) 0%, rgba(232,240,251,0) 60%, #e3ecf8 calc(12svh + 150vw)); }
    .hp-objet { width: 60vw; bottom: auto; top: calc(12svh + 46vw); }
    .hp-brume { width: 80vw; bottom: auto; top: calc(12svh + 98vw); }
    .hp-texte { position: relative; left: auto; top: auto; transform: none; width: auto; }
  }
  @media (prefers-reduced-motion: reduce) { .hp-objet::before { animation: none; } .hp-fond { transition: none; } }
</style>
</head>

<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script>
(function(){
  var box=document.getElementById('hp-objet'), mv=box.querySelector('model-viewer');
  // chargement du bouclier 3D (même modèle que l'accueil)
  // - ouverture locale (double-clic) : le navigateur refuse de lire le .glb, on charge la version intégrée .glb.js
  // - en ligne : le .glb ; si ça échoue, repli sur la version intégrée
  function chargeJS(){
    if(window.SICARE_SHIELD_SRC){ mv.setAttribute('src',window.SICARE_SHIELD_SRC); return; }
    var sc=document.createElement('script'); sc.src='images/sicare-shield.glb.js';
    sc.onload=function(){ if(window.SICARE_SHIELD_SRC) mv.setAttribute('src',window.SICARE_SHIELD_SRC); };
    sc.onerror=function(){ console.warn('SICARE : images/sicare-shield.glb.js introuvable — la page doit être dans le dossier sicare.'); };
    document.head.appendChild(sc);
  }
  if(location.protocol==='file:') chargeJS();
  else { mv.setAttribute('src','images/sicare-shield.glb'); mv.addEventListener('error',chargeJS,{once:true}); }
  mv.addEventListener('load',function(){ box.classList.add('charge'); });
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ mv.removeAttribute('auto-rotate'); return; }
  // parallaxe légère du fond à la souris : renforce la profondeur
  var hp=document.querySelector('.hp'), fond=hp.querySelector('.hp-fond');
  hp.addEventListener('mousemove',function(e){
    var r=hp.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    fond.style.setProperty('--fx',(-x*18).toFixed(1)+'px'); fond.style.setProperty('--fy',(-y*12).toFixed(1)+'px');
  });
})();
</script>
</body>
</html>
